              private TextView decisionText;
              private TextView sessionStatus;

              private int navy;
              private int teal;
              private int ink;
              private int muted;
              private int page;
              private int card;
              private int positive;
              private int warning;
              private int danger;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  navy = Color.rgb(8, 26, 48);

                  teal = Color.rgb(
                      10,
                      143,
                      122
                  );

                  ink = Color.rgb(
                      20,
                      35,
                      53
                  );

                  muted = Color.rgb(
                      92,
                      107,
                      124
                  );

                  page = Color.rgb(
                      244,
                      247,
                      251
                  );

                  card = Color.WHITE;

                  positive = Color.rgb(
                      25,
                      142,
                      92
                  );

                  warning = Color.rgb(
                      191,
                      124,
                      20
                  );

                  danger = Color.rgb(
                      188,
                      58,
                      55
                  );

                  getWindow().setStatusBarColor(navy);
                  getWindow().setNavigationBarColor(navy);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(page);

                  root.setPadding(
                      dp(16),
                      dp(12),
                      dp(16),
                      dp(28)
                  );

                  root.setOnApplyWindowInsetsListener(
                      (view, insets) -> {

                          android.graphics.Insets bars =
                              insets.getInsets(
                                  WindowInsets.Type.systemBars()
                              );

                          view.setPadding(
                              dp(16),
                              Math.max(
                                  dp(12),
                                  bars.top + dp(8)
                              ),
                              dp(16),
                              Math.max(
                                  dp(28),
                                  bars.bottom + dp(12)
                              )
                          );

                          return insets;
                      }
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.setFillViewport(true);

                  scroll.addView(
                      root,
                      new ScrollView.LayoutParams(
                          ScrollView.LayoutParams.MATCH_PARENT,
                          ScrollView.LayoutParams.WRAP_CONTENT
                      )
                  );

                  setContentView(scroll);

                  buildHeader(root);

                  buildDemoBanner(root);

                  buildTodaySection(root);

                  buildChartCalibration(root);

                  buildChartSession(root);

                  buildLiquiditySection(root);

                  buildTradingDaysSection(root);

                  buildDisclaimer(root);
              }

              private void buildHeader(
