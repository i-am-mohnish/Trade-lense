name: Bootstrap TradeLens Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore TradeLens source
        shell: bash
        run: |
          cat > /tmp/tradelens-source.b64 <<'EOF_TL'
          
          EOF_TL
          base64 -d /tmp/tradelens-source.b64 > /tmp/tradelens-source.tgz
          tar -xzf /tmp/tradelens-source.tgz -C /tmp
          cp -a /tmp/project/. "$GITHUB_WORKSPACE/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build Android 14+ APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and SDK metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.tradelens.pocket'" apk-badging.txt
          grep -q "sdkVersion:'34'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Commit verified source to repository
        shell: bash
        run: |
          git config user.name "TradeLens Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add . ':!app/build' ':!.gradle' ':!apk-badging.txt' ':!apk-sha256.txt'
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap TradeLens Pocket v0.3 Android 14+"
            git push
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeLens-Pocket-v0.3-Android14Plus
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: TradeLens-Pocket-v0.3-Verification
          path: |
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
