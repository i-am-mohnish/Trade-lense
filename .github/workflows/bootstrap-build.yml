                      );

                  box.addView(label);

                  TextView message =
                      text(
                          "This build validates the native Android app, chart permission flow, indicators and trading-intelligence interface. Live broker data and calibrated trade probabilities are not connected yet.",
                          13,
                          ink,
                          false
                      );

                  message.setPadding(
                      0,
                      dp(6),
                      0,
