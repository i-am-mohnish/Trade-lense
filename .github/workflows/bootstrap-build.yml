name: Build TradeLens Pocket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Android 14+ APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create native Android project
        shell: bash
        run: |
          rm -rf generated-app

          mkdir -p generated-app/app/src/main/java/com/tradelens/pocket
          mkdir -p generated-app/app/src/main/res/drawable
          mkdir -p generated-app/app/src/main/res/values

          cat > generated-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TradeLensPocket"
          include(":app")
          EOF

          cat > generated-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.12.2' apply false
          }
          EOF

          cat > generated-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > generated-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tradelens.pocket'

              compileSdk 36
              buildToolsVersion "35.0.0"

              defaultConfig {
                  applicationId "com.tradelens.pocket"

                  minSdk 34
                  targetSdk 36

                  versionCode 4
                  versionName "0.4.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError true
              }
          }
          EOF

          cat > generated-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="TradeLens Pocket"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".ChartCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>

          </manifest>
          EOF

          cat > generated-app/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #0A8F7A
                  </item>

                  <item name="android:statusBarColor">
                      #081A30
                  </item>

                  <item name="android:navigationBarColor">
                      #081A30
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowLightNavigationBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

          cat > generated-app/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">

              <path
                  android:fillColor="#081A30"
                  android:pathData="M4,4h40v40h-40z" />

              <path
                  android:fillColor="#19B89A"
                  android:pathData="M9,31 L17,22 L23,27 L34,13 L39,17 L24,37 L18,31 L13,36 Z" />

          </vector>
          EOF

          cat > generated-app/app/src/main/java/com/tradelens/pocket/MainActivity.java <<'EOF'
